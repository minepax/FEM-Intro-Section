<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Frontend Mentor | Intro section with dropdown navigation</title>
</head>

<body>

  <header class="header">

    <a href="" class="header-logo">
      <img src="images/logo.svg" alt="Site Logo">
    </a>
    
    <button class="hamburger-btn" type="button" aria-label="Mobile Navigation Toggle Buttton" aria-controls="header-nav" aria-expanded="false"></button>
    
    <nav class="header-nav" id="header-nav">
      <ul class="nav-list">
        <li>
          <button class="nav-link" aria-label="Navbar Dropdown Menu Toggle" aria-controls="nav-sub-1" aria-expanded="false">
            Features
            <svg width="10" height="6" xmlns="http://www.w3.org/2000/svg">
              <path stroke="#141414" stroke-width="1.5" fill="none" d="m1 1 4 4 4-4"/>
            </svg>
          </button>
          <div class="nav-sub" id="nav-sub-1" aria-hidden="true" data-align-right>
            <ul class="flow">
              <li><a class="nav-link" href="">Todo List</a></li>
              <li><a class="nav-link" href="">Calendar</a></li>
              <li><a class="nav-link" href="">Reminders</a></li>
              <li><a class="nav-link" href="">Planning</a></li>
            </ul>
          </div>
        </li>
        <li>
          <button class="nav-link" aria-label="Navbar Dropdown Menu Toggle" aria-controls="nav-sub-2" aria-expanded="false">
            Company
            <svg width="10" height="6" xmlns="http://www.w3.org/2000/svg">
              <path stroke="#141414" stroke-width="1.5" fill="none" d="m1 1 4 4 4-4"/>
            </svg>
          </button>
          <div class="nav-sub" id="nav-sub-2" aria-hidden="true" data-icon-none>
            <ul class="flow">
              <li><a class="nav-link" href="">History</a></li>
              <li><a class="nav-link" href="">Our Team</a></li>
              <li><a class="nav-link" href="">Blog</a></li>
            </ul>
          </div>
        </li>
        <li><a href="" class="nav-link">Careers</a></li>
        <li><a href="" class="nav-link">About</a></li>
        <li><a href="" class="nav-link">Login</a></li>
        <li><button class="btn">Register</button></li>
      </ul>
    </nav>


  </header>

  <main>

    <section class="hero">
      <div class="wrapper">

        <div class="hero-content flow">

          <h1 class="hero-title">Make remote work</h1>

          <p>
            Get your team in sync, no matter your location. Streamline processes, 
            create team rituals, and watch productivity soar.
          </p>

          <a href="" class="btn">Learn more</a>

          <div class="partners">
            <img src="images/client-databiz.svg" alt="Databiz logo">
            <img src="images/client-audiophile.svg" alt="Audiophile logo">
            <img src="images/client-meet.svg" alt="Meet logo">
            <img src="images/client-maker.svg" alt="Maker logo">
          </div>

        </div>

        <picture>
          <source media="(max-width: 53rem)" srcset="images/image-hero-mobile.png">
          <img src="images/image-hero-desktop.png" alt="">
        </picture>

      </div>
    </section>

  </main>

</body>
</html>
